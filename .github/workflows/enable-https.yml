name: Enable Pages HTTPS

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable HTTPS when certificate is ready
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$(gh api "repos/$REPOSITORY/pages" --jq '.https_enforced')" = "true" ]; then
            echo "HTTPS is already enforced."
            exit 0
          fi

          gh api --method PUT "repos/$REPOSITORY/pages" -F https_enforced=true || {
            echo "The certificate is still being provisioned; the next scheduled run will retry."
            exit 0
          }